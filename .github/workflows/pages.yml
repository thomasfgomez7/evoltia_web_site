name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos para que la Action pueda publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue por vez; si llega un push nuevo, se cancela el anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Solo se publica site/. El resto del repo (docs, marca, inventario)
      # queda versionado pero no servido.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
